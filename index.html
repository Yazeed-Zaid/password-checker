<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Blocks all network access: no fetch, no images, no external scripts -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Password Strength Checker</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#5d667a; --border:#d9deea;
    --weak:#d93a3a; --mid:#e08a00; --strong:#1a9c55; --track:#e6e9f2; --accent:#3563e9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10131b; --card:#1a1f2c; --text:#e8ebf4; --muted:#9aa3b8; --border:#2c3347;
      --weak:#ff6b6b; --mid:#f5b042; --strong:#3ddc84; --track:#2a3043; --accent:#7b9bff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;padding:16px}
  main{max-width:640px;margin:24px auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
  .field{display:flex;gap:8px}
  input{flex:1;min-width:0;font-size:1.1rem;padding:12px 14px;border:1px solid var(--border);
    border-radius:10px;background:var(--bg);color:var(--text);direction:ltr;text-align:left}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{font:inherit;padding:0 16px;border:1px solid var(--border);border-radius:10px;
    background:var(--card);color:var(--text);cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent)}
  #lang{padding:6px 12px;white-space:nowrap;flex-shrink:0}
  .meter{height:10px;background:var(--track);border-radius:99px;margin:18px 0 8px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--muted);border-radius:99px;transition:width .25s,background .25s}
  .rating{font-size:1.25rem;font-weight:700;min-height:1.9rem}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:1.05rem}
  .stat span{font-size:.8rem;color:var(--muted)}
  h2{font-size:1rem;margin:18px 0 6px}
  ul{margin:0;padding:0;padding-inline-start:20px}
  li{margin:4px 0}
  .bad::marker{color:var(--weak)} .ok::marker{color:var(--strong)} .tip::marker{color:var(--accent)}
  .note{margin-top:18px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}
  [hidden]{display:none!important}
  @media (max-width:420px){ .stats{grid-template-columns:1fr} }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="head">
      <div>
        <h1 data-i18n="heading"></h1>
        <p class="sub" data-i18n="intro"></p>
      </div>
      <button id="lang" type="button"></button>
    </div>

    <label for="pw" class="sub" style="display:block;margin-bottom:6px" data-i18n="label"></label>
    <div class="field">
      <input id="pw" type="password" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256">
      <button id="toggle" type="button" aria-pressed="false"></button>
    </div>

    <div class="meter" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <div class="rating" id="rating" aria-live="polite"></div>

    <div id="details" hidden>
      <div class="stats">
        <div class="stat"><b id="sLen">0</b><span data-i18n="statLen"></span></div>
        <div class="stat"><b id="sBits">0</b><span data-i18n="statBits"></span></div>
        <div class="stat"><b id="sTime">-</b><span data-i18n="statTime"></span></div>
      </div>
      <h2 data-i18n="whyHead"></h2>
      <ul id="reasons"></ul>
      <h2 data-i18n="tipsHead"></h2>
      <ul id="tips"></ul>
    </div>

    <p class="note" data-i18n="note"></p>
  </div>
</main>

<script>
(() => {
  "use strict";

  // ---------- Translations ----------
  const I18N = {
    en: {
      title: "Yazeed's Password Checker",
      heading: "🔐 Yazeed's Password Checker",
      intro: "All checks run inside your browser. Your password is never sent or stored anywhere.",
      label: "Enter a password",
      show: "Show", hide: "Hide",
      switchTo: "العربية",
      statLen: "Characters", statBits: "Entropy (bits)", statTime: "Est. time to crack",
      whyHead: "Why this rating?", tipsHead: "How to improve it",
      note: "Note: estimates are approximate (assuming a guessing attack of 10 billion attempts per second against a weak hash). Use a different password for every account, ideally with a password manager and two-factor authentication.",
      strength: "Strength: ",
      levels: ["Weak 🔴", "Medium 🟠", "Strong 🟢"],

      rShort: n => `Too short (${n} characters). Every extra character makes it much harder to guess.`,
      rLenOk: n => `Length (${n}) is acceptable, but 12 or more characters is better.`,
      rLenGreat: n => `Length (${n} characters) is excellent.`,
      rVarGood: () => "Good mix of different character types.",
      rVar2: () => "Limited variety (only two types of characters).",
      rVar1: () => "Only one type of character (for example, only digits or only lowercase letters).",
      rCommon: () => "It is (or is built on) a very common password. Attackers try these first.",
      rBlock: () => "It is a repeating pattern, which makes it much easier to guess.",
      rRepeat: () => "It repeats the same character 3 or more times in a row (like aaa or 111).",
      rSeq: seq => `It contains a predictable sequence ("${seq}"): alphabetical, numeric, or keyboard order.`,
      rYear: () => "It contains a year (like a birth year), which an attacker would expect.",
      rSuffix: () => "The \"word + number or symbol at the end\" pattern is well known and adds little security.",

      tLen12: () => "Make it at least 12 characters long, ideally 16 or more.",
      tPassphrase: () => "Use a passphrase: 4 or more random words, like \"coffee-mountain-star-7-cloud\".",
      tUpper: () => "Add uppercase letters.",
      tDigit: () => "Add digits (preferably in the middle, not only at the end).",
      tSymbol: () => "Add symbols such as ! ? # % -",
      tCommon: () => "Avoid common words and names, even with letter swaps (a→@, o→0).",
      tSeq: () => "Avoid sequences like abc, 1234, or qwerty.",
      tRep: () => "Avoid repetition like aaa or repeated chunks.",
      tYear: () => "Don't use birth dates or years.",
      tReuse: () => "Don't reuse the same password across accounts.",
      tManager: () => "Use a password manager to generate random passwords, and turn on two-factor authentication.",

      instantly: "Instantly",
      unit: (n, w) => `${n.toLocaleString("en")} ${w}${n === 1 ? "" : "s"}`,
      units: {second: "second", minute: "minute", hour: "hour", day: "day", year: "year"},
      forever: "Over a million years",
    },
    ar: {
      title: "فاحص قوة كلمة السر",
      heading: "🔐 فاحص قوة كلمة السر",
      intro: "كل الفحص بيصير داخل متصفحك. كلمة السر ما بتنرسل ولا بتنحفظ في أي مكان.",
      label: "اكتب كلمة السر",
      show: "إظهار", hide: "إخفاء",
      switchTo: "English",
      statLen: "عدد الأحرف", statBits: "الإنتروبيا (بت)", statTime: "وقت الكسر التقريبي",
      whyHead: "ليش هذا التقييم؟", tipsHead: "كيف تحسّنها؟",
      note: "ملاحظة: التقدير تقريبي (بافتراض هجوم تخمين بسرعة 10 مليار محاولة بالثانية على هاش ضعيف). استخدم كلمة سر مختلفة لكل حساب، ويُفضّل مدير كلمات سر وتفعيل التحقق بخطوتين.",
      strength: "القوة: ",
      levels: ["ضعيفة 🔴", "متوسطة 🟠", "قوية 🟢"],

      rShort: n => `قصيرة (${n} أحرف). كل ما زاد الطول صار تخمينها أصعب بكثير.`,
      rLenOk: n => `طولها (${n}) مقبول، بس الأفضل 12 حرف أو أكثر.`,
      rLenGreat: n => `طولها (${n} حرف) ممتاز.`,
      rVarGood: () => "فيها تنوع جيد بين أنواع الأحرف.",
      rVar2: () => "التنوع محدود (نوعين فقط من الأحرف).",
      rVar1: () => "كلها من نوع واحد من الأحرف (مثلاً أرقام فقط أو حروف صغيرة فقط).",
      rCommon: () => "هي (أو مبنية على) كلمة سر شائعة جداً، والمهاجمون بيجربوها أول شي.",
      rBlock: () => "عبارة عن نمط بيتكرر، وهذا بيسهّل تخمينها كتير.",
      rRepeat: () => "فيها حرف مكرر ورا بعض 3 مرات أو أكثر (مثل aaa أو 111).",
      rSeq: seq => `فيها تسلسل متوقع ("${seq}") سواء أبجدي أو رقمي أو من الكيبورد.`,
      rYear: () => "فيها سنة (مثل تاريخ ميلاد)، وهذا شي بيتوقعه المهاجم.",
      rSuffix: () => "النمط «كلمة + رقم أو رمز بالنهاية» معروف ومش بيضيف أمان كبير.",

      tLen12: () => "خلّيها 12 حرف على الأقل، والأفضل 16 أو أكثر.",
      tPassphrase: () => "استخدم عبارة سر (passphrase): 4 كلمات عشوائية أو أكثر، مثل «قهوة-جبل-نجمة-7-سحاب».",
      tUpper: () => "أضف أحرف كبيرة.",
      tDigit: () => "أضف أرقام (ويفضّل بنص الكلمة مش بالنهاية فقط).",
      tSymbol: () => "أضف رموز مثل ! ? # % -",
      tCommon: () => "ابتعد عن الكلمات الشائعة والأسماء، حتى لو بدّلت الحروف برموز (a→@ ، o→0).",
      tSeq: () => "تجنّب التسلسلات مثل abc أو 1234 أو qwerty.",
      tRep: () => "تجنّب التكرار مثل aaa أو تكرار نفس المقطع.",
      tYear: () => "ما تستخدم تواريخ ميلاد أو سنوات.",
      tReuse: () => "ما تستخدم نفس كلمة السر في أكثر من حساب.",
      tManager: () => "استخدم مدير كلمات سر ليولّد لك كلمات عشوائية، وفعّل التحقق بخطوتين.",

      instantly: "فوري",
      unit: (n, w) => `${n.toLocaleString("en")} ${w}`,
      units: {second: "ثانية", minute: "دقيقة", hour: "ساعة", day: "يوم", year: "سنة"},
      forever: "أكثر من مليون سنة",
    },
  };

  let lang = /^ar/i.test(navigator.language || "") ? "ar" : "en";
  const tr = (key, ...args) => {
    const v = I18N[lang][key];
    return typeof v === "function" ? v(...args) : v;
  };

  // ---------- Data ----------
  // Small list of very common passwords
  const COMMON = new Set(`password pass passw0rd p@ssw0rd p@ssword password1 password12 password123 passw0rd1
    123456 1234567 12345678 123456789 1234567890 12345 1234 111111 000000 123123 121212 112233 654321 666666 777777 888888 999999 123321 696969
    qwerty qwerty123 qwertyuiop asdfgh asdfghjkl zxcvbn zxcvbnm 1q2w3e4r 1qaz2wsx qazwsx qweasd azerty
    abc123 abcd1234 abcdef a1b2c3 iloveyou iloveu letmein welcome welcome1 admin admin123 administrator root toor login
    master monkey dragon sunshine princess football baseball superman batman shadow michael jordan hunter
    trustno1 freedom whatever starwars hello hello123 secret test test123 guest user default changeme
    mohammed mohamed muhammad ahmed ahmad ali omar khaled hassan hussein allah alhamdulillah bismillah
    habibi habibti ana7ebak 7abibi amman palestine syria lebanon iraq egypt saudi
    ya3ni inshallah mashallah`.split(/\s+/).filter(Boolean));

  const KEYBOARD_ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm","1234567890","!@#$%^&*()"];
  const LEET = {"0":"o","1":"l","3":"e","4":"a","5":"s","7":"t","8":"b","@":"a","$":"s","!":"i","|":"l","+":"t"};

  const $ = id => document.getElementById(id);
  const pw = $("pw"), bar = $("bar"), rating = $("rating"), details = $("details");

  // ---------- Analysis (language independent) ----------
  function poolSize(s){
    let n = 0;
    if (/[a-z]/.test(s)) n += 26;
    if (/[A-Z]/.test(s)) n += 26;
    if (/[0-9]/.test(s)) n += 10;
    if (/[^A-Za-z0-9؀-ۿ]/.test(s)) n += 33;
    if (/[؀-ۿ]/.test(s)) n += 36; // Arabic letters
    return n || 1;
  }

  // Finds sequences (abc, 123, cba) and keyboard runs
  function findSequence(lower){
    const minLen = 3;
    const bases = ["abcdefghijklmnopqrstuvwxyz","0123456789", ...KEYBOARD_ROWS];
    for (const base of bases){
      for (const b of [base, [...base].reverse().join("")]){
        for (let i = 0; i + minLen <= b.length; i++){
          const seg = b.slice(i, i + minLen);
          if (lower.includes(seg)) return seg;
        }
      }
    }
    return null;
  }

  function hasRepeat(s){ return /(.)\1{2,}/.test(s); }
  function hasRepeatedBlock(s){ return /^(.{1,4})\1+$/.test(s) && s.length >= 4; }
  function hasYear(s){ return /(19[5-9]\d|20[0-3]\d)/.test(s); }

  function deLeet(s){ return [...s].map(c => LEET[c] || c).join(""); }

  function isCommon(s){
    const l = s.toLowerCase();
    if (COMMON.has(l)) return l;
    const d = deLeet(l);
    if (COMMON.has(d)) return d;
    // Common word plus digits/symbols at the ends (e.g. password2024!)
    const stripped = d.replace(/[^a-z؀-ۿ]+$/g, "").replace(/^[^a-z؀-ۿ]+/g, "");
    if (stripped.length >= 4 && COMMON.has(stripped)) return stripped;
    return null;
  }

  // Returns message keys (not text) so the result can be shown in either language
  function analyze(s){
    const reasons = [], tips = [];
    const len = [...s].length;
    const lower = s.toLowerCase();

    const hasLower = /[a-z]/.test(s), hasUpper = /[A-Z]/.test(s), hasDigit = /[0-9]/.test(s);
    const hasSymbol = /[^A-Za-z0-9؀-ۿ]/.test(s);
    const hasArabic = /[؀-ۿ]/.test(s);
    const kinds = [hasLower, hasUpper, hasDigit, hasSymbol, hasArabic].filter(Boolean).length;

    // Base entropy
    let bits = len * Math.log2(poolSize(s));
    let capWeak = false;
    const penalties = [];

    // Length
    if (len < 8){ reasons.push({t:"bad", k:"rShort", a:[len]}); capWeak = true; }
    else if (len < 12) reasons.push({t:"ok", k:"rLenOk", a:[len]});
    else reasons.push({t:"ok", k:"rLenGreat", a:[len]});

    // Character variety
    if (kinds >= 3) reasons.push({t:"ok", k:"rVarGood"});
    else if (kinds === 2) reasons.push({t:"bad", k:"rVar2"});
    else reasons.push({t:"bad", k:"rVar1"});

    // Common password
    const common = isCommon(s);
    if (common){
      reasons.push({t:"bad", k:"rCommon"});
      bits = Math.min(bits, 15); capWeak = true;
    }

    // Repetition
    if (hasRepeatedBlock(s)){
      reasons.push({t:"bad", k:"rBlock"});
      bits *= 0.4; penalties.push("rep");
    } else if (hasRepeat(s)){
      reasons.push({t:"bad", k:"rRepeat"});
      bits -= 8; penalties.push("rep");
    }

    // Sequences
    const seq = findSequence(lower);
    if (seq){
      reasons.push({t:"bad", k:"rSeq", a:[seq]});
      bits -= 10; penalties.push("seq");
    }

    // Year
    if (hasYear(s)){
      reasons.push({t:"bad", k:"rYear"});
      bits -= 6; penalties.push("year");
    }

    // Digit/symbol only at the end
    if (/^[A-Za-z؀-ۿ]+[0-9!@#$%^&*]{1,3}$/.test(s) && !common){
      reasons.push({t:"bad", k:"rSuffix"});
      bits -= 6;
    }

    bits = Math.max(0, bits);

    // Rating
    let level;
    if (capWeak || bits < 40) level = 0;
    else if (bits < 60 || len < 10) level = 1;
    else level = 2;
    if (level === 2 && (penalties.length >= 2 || kinds < 2)) level = 1;

    // Tips
    if (len < 12) tips.push({k:"tLen12"});
    if (len < 16) tips.push({k:"tPassphrase"});
    if (!hasUpper && hasLower) tips.push({k:"tUpper"});
    if (!hasDigit) tips.push({k:"tDigit"});
    if (!hasSymbol) tips.push({k:"tSymbol"});
    if (common) tips.push({k:"tCommon"});
    if (seq) tips.push({k:"tSeq"});
    if (penalties.includes("rep")) tips.push({k:"tRep"});
    if (penalties.includes("year")) tips.push({k:"tYear"});
    tips.push({k:"tReuse"});
    tips.push({k:"tManager"});

    return {len, bits, level, reasons, tips};
  }

  // ---------- Rendering ----------
  function formatTime(bits){
    const sec = Math.pow(2, bits) / 2 / 1e10;
    const u = I18N[lang].units;
    if (sec < 1) return tr("instantly");
    let v = sec;
    if (v < 60) return tr("unit", Math.round(v), u.second);
    v /= 60; if (v < 60) return tr("unit", Math.round(v), u.minute);
    v /= 60; if (v < 24) return tr("unit", Math.round(v), u.hour);
    v /= 24; if (v < 365) return tr("unit", Math.round(v), u.day);
    v /= 365; if (v < 1e6) return tr("unit", Math.round(v), u.year);
    return tr("forever");
  }

  const LEVEL_STYLE = [
    {color:"var(--weak)", width:"28%"},
    {color:"var(--mid)", width:"62%"},
    {color:"var(--strong)", width:"100%"},
  ];

  function fill(ul, items, fallbackClass){
    ul.textContent = "";
    for (const it of items){
      const li = document.createElement("li");
      li.className = it.t || fallbackClass;
      li.textContent = tr(it.k, ...(it.a || []));
      ul.appendChild(li);
    }
  }

  function render(){
    const s = pw.value;
    if (!s){
      bar.style.width = "0"; rating.textContent = ""; rating.style.color = "";
      details.hidden = true; return;
    }
    const r = analyze(s), L = LEVEL_STYLE[r.level];
    bar.style.width = L.width; bar.style.background = L.color;
    rating.textContent = tr("strength") + I18N[lang].levels[r.level];
    rating.style.color = L.color;
    $("sLen").textContent = r.len;
    $("sBits").textContent = Math.round(r.bits);
    $("sTime").textContent = formatTime(r.bits);
    fill($("reasons"), r.reasons, "");
    fill($("tips"), r.tips, "tip");
    details.hidden = false;
  }

  function applyLang(){
    const html = document.documentElement;
    html.lang = lang;
    html.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = tr("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
    $("lang").textContent = tr("switchTo");
    $("lang").lang = lang === "ar" ? "en" : "ar";
    $("toggle").textContent = pw.type === "password" ? tr("show") : tr("hide");
    render();
  }

  // ---------- Events ----------
  pw.addEventListener("input", render);
  $("toggle").addEventListener("click", e => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    e.currentTarget.setAttribute("aria-pressed", show);
    e.currentTarget.textContent = show ? tr("hide") : tr("show");
  });
  $("lang").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>
